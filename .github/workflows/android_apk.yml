name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Clone lv_micropython
      uses: actions/checkout@v4
      with:
        repository: lvgl/lv_micropython
        ref: master

    - name: Remove pinned lv_bindings submodule
      run: rm -rf user_modules/lv_binding_micropython

    - name: Checkout lv_bindings
      uses: actions/checkout@v4
      with:
        path: user_modules/lv_binding_micropython
        submodules: recursive

    - name: Update unix port submodules
      run: make -C ports/unix VARIANT=lvgl submodules

    - name: Build APK
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
      run: user_modules/lv_binding_micropython/ports/android/build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: lvgl-micropython-apk
        path: ports/unix/build-android/lvgl-micropython.apk
